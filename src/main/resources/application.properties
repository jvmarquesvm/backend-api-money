spring.application.name=algamoney-api
spring.jpa.database=MYSQL
spring.datasource.url=jdbc:mysql://localhost/algamoneyapi?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
#spring.datasource.password=toor#123
spring.datasource.password=
spring.jpa.show-sql=true

#Falha quando encontra propriedades desconhecidas na deserializacao
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=http://localhost:8080/oauth/check_token
spring.security.oauth2.resourceserver.opaquetoken.client-id=angular
spring.security.oauth2.resourceserver.opaquetoken.client-secret=@ngul@r0

algamoney.seguranca.enable-https=false

#Alternando entre Authentication Basic e Oauth2
#spring.profiles.active=basic-security
spring.profiles.active=oauth-security

spring.profiles.group.prod=oauth-security
logging.level.org.springframework.security=DEBUG
